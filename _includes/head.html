<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0a0e">
  <script>/* 움직임을 꺼 둔 사람은 첫 화면부터 멈춘 상태로 */try{if(localStorage.getItem('ovan-motion')==='off')document.documentElement.classList.add('paused')}catch(_){}</script>
  {%- if page.layout == 'home' %}
  <script>
    /* 타이틀 화면을 띄울지 그리기 전에 정해서 메뉴가 먼저 번쩍 보이지 않게 한다 */
    try{if(!sessionStorage.getItem('ovan-title')||/[?&]title=1/.test(location.search))document.documentElement.classList.add('t-on')}catch(_){}
    /* 홈 스크립트가 못 돌면 타이틀과 등장 연출을 걷어 내서 메뉴가 그냥 보이게 한다 */
    addEventListener('load',function(){if(!window.OVAN_HOME){document.documentElement.classList.remove('t-on');document.body.classList.remove('intro')}});
  </script>
  {%- endif %}
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800;1,900&family=Black+Han+Sans&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {%- assign page_css = "home,post,category,archive,about" | split: "," -%}
  {%- if page_css contains page.layout %}
  <link rel="stylesheet" href="{{ '/assets/css/' | append: page.layout | append: '.css' | relative_url }}">
  {%- endif %}
  <script defer src="{{ '/assets/js/ovan-data.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/ovan.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/eggs.js' | relative_url }}"></script>
</head>
