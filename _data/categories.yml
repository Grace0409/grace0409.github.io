# 블로그 카테고리 목록 (이 순서대로 홈 메뉴에 놓입니다)
# 글을 쓸 때 front matter에 `category: <slug>` 로 지정합니다.
#   name : 페이지 제목, 검색 결과에 쓰는 이름
#   en   : 홈 메뉴와 카드에 크게 들어가는 영문 이름
#   ko   : 영문 옆에 붙는 짧은 한글 이름
#   type : 카드 위 라벨 (게임의 역할군 자리)
- slug: dev
  name: 개발
  en: Dev
  ko: 개발
  type: BUILD
  desc: 직접 만들고 부딪히며 배운 개발 기록

- slug: ctf-wargame
  name: CTF/Wargame
  en: CTF / Wargame
  ko: CTF/Wargame
  type: ATTACK
  desc: CTF 대회 참가 후기와 워게임 문제 풀이(Write-up)

- slug: bug-bounty
  name: Bug Bounty
  en: Bug Bounty
  ko: 버그바운티
  type: HUNT
  desc: 취약점을 찾고 제보하는 과정과 버그바운티 활동

- slug: tech-docs
  name: 블로그/기술문서
  en: Tech Docs
  ko: 기술문서
  type: STUDY
